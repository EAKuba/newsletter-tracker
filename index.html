<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Security Newsletter Leaderboard</title>

  <!-- Norwester-like headline font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg1: #0b2cff;
      --bg2: #8b00ff;

      --card: rgba(10, 12, 30, 0.55);
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.70);
      --line: rgba(255,255,255,0.12);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(900px 500px at 20% 15%, rgba(33,212,255,0.25), transparent 60%),
                  radial-gradient(700px 500px at 70% 80%, rgba(124,77,255,0.25), transparent 60%),
                  linear-gradient(135deg, var(--bg1), var(--bg2));
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 26px 22px 40px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .logo {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      padding: 10px;
      display: grid;
      place-items: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      flex: 0 0 auto;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .titleblock { min-width: 0; }

    .title {
      font-family: "Bebas Neue", Inter, system-ui, sans-serif;
      letter-spacing: 0.5px;
      font-size: 44px;
      line-height: 1.0;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .subtitle {
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted);
    }

    .season {
      font-family: "Bebas Neue", Inter, system-ui, sans-serif;
      font-size: 28px;
      letter-spacing: 0.6px;
      color: rgba(255,255,255,0.92);
      padding: 10px 14px;
      border-radius: 16px;
      background: rgba(0,0,0,0.18);
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: 0 10px 25px rgba(0,0,0,0.10);
      flex: 0 0 auto;
    }

    /* Panel */
    .panel {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 18px;
      overflow: visible; /* allow hover previews to escape panel edges */
      box-shadow: 0 18px 60px rgba(0,0,0,0.22);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .panelhead {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(90deg, rgba(33,212,255,0.12), rgba(124,77,255,0.10));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-top-left-radius: 18px;
      border-top-right-radius: 18px;
    }

    .panelhead .hint {
      font-size: 12px;
      color: var(--muted);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      text-align: left;
      font-size: 12px;
      color: rgba(255,255,255,0.78);
      letter-spacing: 0.3px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(0,0,0,0.18);
      white-space: nowrap;
    }

    tbody td {
      padding: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      vertical-align: top;
      overflow: visible; /* allow previews */
    }

    tbody tr:hover {
      background: rgba(255,255,255,0.04);
    }

    .id {
      font-weight: 900;
      font-size: 14px;
    }

    .total {
      text-align: right;
      font-weight: 900;
      font-size: 18px;
      color: rgba(255,255,255,0.95);
    }

    .seasonCell .topline {
      font-size: 13px;
      font-weight: 900;
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }

    .seasonCell .pts {
      font-size: 12px;
      color: rgba(255,255,255,0.75);
      font-weight: 700;
    }

    /* Badges row: force horizontal, no wrap */
    .badgeRow {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: nowrap;
      overflow: visible;
    }

    .badgeImgWrap {
      position: relative;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06);
      display: grid;
      place-items: center;
      box-shadow: 0 12px 30px rgba(0,0,0,0.18);
      flex: 0 0 auto;
      overflow: visible;
    }

    .badgeImg {
      width: 36px;
      height: 36px;
      object-fit: contain;
      display: block;
      transform: translateZ(0);
    }

    .locked {
      filter: grayscale(1) brightness(0.60) contrast(0.95);
      opacity: 0.55;
    }

    /* Hover preview to the RIGHT */
    .badgePreview {
      position: absolute;
      left: calc(100% + 12px);
      top: 50%;
      transform: translateY(-50%);
      width: 140px;
      height: 140px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(10, 12, 30, 0.85);
      box-shadow: 0 18px 60px rgba(0,0,0,0.38);
      display: none;
      place-items: center;
      padding: 10px;
      z-index: 999;
      pointer-events: none;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .badgePreview img{
      width: 120px;
      height: 120px;
      object-fit: contain;
      display: block;
    }

    .badgeImgWrap:hover .badgePreview {
      display: grid;
    }

    .empty {
      color: rgba(255,255,255,0.55);
      font-size: 12px;
    }

    .finalCell {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .finalLabel {
      font-size: 12px;
      color: rgba(255,255,255,0.75);
      font-weight: 700;
      white-space: nowrap;
    }

    .errorCard {
      padding: 14px;
      border-radius: 18px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
    }

    @media (max-width: 920px) {
      .title { font-size: 36px; }
      .season { font-size: 22px; padding: 8px 12px; }
      .logo { width: 56px; height: 56px; }
      thead th:nth-child(n+3) { min-width: 260px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="brand">
        <div class="logo">
          <img src="./assets/logo.png" alt="EA Forums Security Newsletter" />
        </div>

        <div class="titleblock">
          <h1 class="title">Security Newsletter Leaderboard</h1>
          <div class="subtitle">Last Update: <span id="lastUpdate">loading…</span></div>
        </div>
      </div>

      <div class="season" id="seasonLabel" style="display:none;">Season 1</div>
    </div>

    <div class="panel">
      <div class="panelhead">
        <div class="hint" id="hint">Leaderboard</div>
        <div class="hint" id="hint2"></div>
      </div>

      <div id="tableWrap"></div>
    </div>
  </div>

  <script>
    let DATA = null;

    const BADGE_DIR = './assets/badges/';
    const FINAL_BADGE_FILE = 'final badge.png';

    const CLASS_BADGE_FILES = {
      'Scout':      { 1:'Scout_Level_1.png',      2:'Scout_Level_2.png',      3:'Scout_Level_3.png' },
      'Sentinel':   { 1:'Sentinel_Level_1.png',   2:'Sentinel_Level_2.png',   3:'Sentinel_Level_3.png' },
      'Archivist':  { 1:'Archivist_Level_1.png',  2:'Archivist_Level_2.png',  3:'Archivist_Level_3.png' },
      'Cipher':     { 1:'Cipher_Level_1.png',     2:'Cipher_Level_2.png',     3:'Cipher_Level_3.png' }
    };

    function badgeUrl(fileName) {
      return BADGE_DIR + encodeURIComponent(fileName);
    }

    function classBadgeUrl(clazz, level) {
      const m = CLASS_BADGE_FILES[String(clazz || '').trim()];
      if (!m || !m[level]) return '';
      return badgeUrl(m[level]);
    }

    // Only the highest unlocked level is colored (new thresholds).
    function highestUnlockedLevel(points) {
      const p = Number(points || 0);
      if (p >= 8) return 3;          // Level 3
      if (p >= 4) return 2;          // Level 2
      if (p >= 1) return 1;          // Level 1
      return 0;
    }

    function finalUnlockedForPlayer(player, seasonsOrder) {
      const seasons = (player && player.seasons) ? player.seasons : {};
      const order = Array.isArray(seasonsOrder) && seasonsOrder.length
        ? seasonsOrder
        : ['Season 1','Season 2','Season 3','Season 4'];
    
      for (let i = 0; i < order.length; i++) {
        const s = seasons[order[i]];
        const pts = s ? Number(s.points || 0) : 0;
        if (!(pts >= 8)) return false;
      }
      return true;
    }

    async function loadData() {
      const res = await fetch('./progress.json?ts=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('Failed to load progress.json: ' + res.status);
      DATA = await res.json();

      const iso = String(DATA.updatedAt || '');
      const formatted = iso && iso.length >= 16 ? (iso.slice(0,16).replace('T',' ')) : '(missing)';
      document.getElementById('lastUpdate').textContent = formatted;

      const cs = String(DATA.currentSeason || '').trim();
      const seasonEl = document.getElementById('seasonLabel');
      if (cs) {
        seasonEl.textContent = cs;
        seasonEl.style.display = 'inline-block';
      } else {
        seasonEl.style.display = 'none';
      }

      renderTable();
    }

    function renderBadgeImg(url, isColored, altText) {
      if (!url) {
        return `<div class="badgeImgWrap"><div class="empty">—</div></div>`;
      }

      const lockedClass = isColored ? '' : 'locked';

      return `
        <div class="badgeImgWrap" title="${escapeHtml(altText)}">
          <img class="badgeImg ${lockedClass}" src="${url}" alt="${escapeHtml(altText)}" />
          <div class="badgePreview">
            <img src="${url}" alt="${escapeHtml(altText)}" class="${lockedClass}" />
          </div>
        </div>
      `;
    }

    function renderTable() {
      const wrap = document.getElementById('tableWrap');
      wrap.innerHTML = '';

      const seasonsOrder = Array.isArray(DATA.seasonsOrder) ? DATA.seasonsOrder : ['Season 1','Season 2','Season 3','Season 4'];
      const players = Array.isArray(DATA.players) ? DATA.players : [];

      const table = document.createElement('table');

      const thead = document.createElement('thead');
      const trh = document.createElement('tr');
      trh.innerHTML = `
        <th style="width:240px;">Forum ID</th>
        <th style="width:90px; text-align:right;">Total</th>
        ${seasonsOrder.map(s => `<th>${escapeHtml(s)}</th>`).join('')}
        <th style="width:160px;">Final</th>
      `;
      thead.appendChild(trh);
      table.appendChild(thead);

      const tbody = document.createElement('tbody');

      players.forEach(p => {
        const tr = document.createElement('tr');

        const total = Number(p.totalPoints || 0);
        const seasons = p.seasons || {};

        const seasonCells = seasonsOrder.map(seasonName => {
          const s = seasons[seasonName];
          if (!s) return `<div class="empty">—</div>`;

          const cls = String(s.class || '').trim();
          const pts = Number(s.points || 0);

          const top = highestUnlockedLevel(pts);

          const b1 = classBadgeUrl(cls, 1);
          const b2 = classBadgeUrl(cls, 2);
          const b3 = classBadgeUrl(cls, 3);

          const badgesHtml = `
            <div class="badgeRow">
              ${renderBadgeImg(b1, top === 1, cls + ' Level 1')}
              ${renderBadgeImg(b2, top === 2, cls + ' Level 2')}
              ${renderBadgeImg(b3, top === 3, cls + ' Level 3')}
            </div>
          `;

          return `
            <div class="seasonCell">
              <div class="topline">
                <span>${escapeHtml(cls || 'Unknown')}</span>
                <span class="pts">${pts} pts</span>
              </div>
              ${badgesHtml}
            </div>
          `;
        }).join('</td><td>');

        const finalUrl = badgeUrl(FINAL_BADGE_FILE);
        const finalIsUnlocked = finalUnlockedForPlayer(p, seasonsOrder);
        const finalHtml = `
          <div class="finalCell">
            <div class="badgeImgWrap" title="Final badge">
              <img class="badgeImg ${finalIsUnlocked ? '' : 'locked'}" src="${finalUrl}" alt="Final badge" />
              <div class="badgePreview">
                <img src="${finalUrl}" alt="Final badge" class="${finalIsUnlocked ? '' : 'locked'}" />
              </div>
            </div>
            <div class="finalLabel">${finalIsUnlocked ? 'Unlocked' : 'Locked'}</div>
          </div>
        `;

        tr.innerHTML = `
          <td><div class="id">${escapeHtml(p.handle || '')}</div></td>
          <td class="total">${total}</td>
          <td>${seasonCells}</td>
          <td>${finalHtml}</td>
        `;

        tbody.appendChild(tr);
      });

      table.appendChild(tbody);
      wrap.appendChild(table);

      document.getElementById('hint').textContent = `Players: ${players.length}`;
      document.getElementById('hint2').textContent = '';
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    loadData().catch(err => {
      const wrap = document.getElementById('tableWrap');
      wrap.innerHTML = `<div class="errorCard"><strong>Error</strong><div class="muted" style="margin-top:6px;">${escapeHtml(err.message)}</div></div>`;
      document.getElementById('lastUpdate').textContent = '(error)';
    });
  </script>
</body>
</html>
